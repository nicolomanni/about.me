<svg xmlns="http://www.w3.org/2000/svg" width="640" height="720" viewBox="0 0 640 720" role="img" aria-labelledby="title desc">
  <title id="title">Nicolò Manni — Full-stack DeFi engineer</title>
  <desc id="desc">A mobile animated systems diagram connects interface, API, and smart contract layers below Nicolò Manni's name.</desc>

  <defs>
    <linearGradient id="signal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f3d37c" />
      <stop offset="0.5" stop-color="#d9943f" />
      <stop offset="1" stop-color="#f3d37c" />
    </linearGradient>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#f3d37c" stop-opacity="0.18" />
      <stop offset="1" stop-color="#f3d37c" stop-opacity="0" />
    </radialGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" fill="none" stroke="#d8e2dc" stroke-opacity="0.055" />
    </pattern>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .mono { font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace; }
    .signal-line { animation: flow 5s linear infinite; }
    .signal-line.slow { animation-duration: 7s; animation-direction: reverse; }
    .pulse { transform-box: fill-box; transform-origin: center; animation: pulse 2.8s ease-in-out infinite; }
    .pulse.delay { animation-delay: -1.4s; }
    .blink { animation: blink 1s steps(1, end) infinite; }
    .packet { filter: url(#glow); }
    @keyframes flow { to { stroke-dashoffset: -104; } }
    @keyframes pulse { 0%, 100% { opacity: .45; transform: scale(.82); } 50% { opacity: 1; transform: scale(1.12); } }
    @keyframes blink { 0%, 48% { opacity: 1; } 49%, 100% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) {
      .signal-line, .pulse, .blink { animation: none !important; }
      .motion-only { display: none; }
    }
  </style>

  <rect width="640" height="720" rx="28" fill="#0b1418" />
  <rect x="1" y="1" width="638" height="718" rx="27" fill="none" stroke="#31464b" stroke-width="2" />
  <rect x="18" y="18" width="604" height="684" rx="16" fill="url(#grid)" />

  <g class="mono" font-size="13" letter-spacing="2">
    <circle class="pulse" cx="45" cy="48" r="5" fill="#80c9a5" />
    <text x="60" y="53" fill="#b6c6c2">SYSTEM PROFILE / 01</text>
    <text x="595" y="53" fill="#728783" text-anchor="end">IT / UTC+2</text>
  </g>

  <g class="sans">
    <text x="40" y="112" fill="#f3d37c" font-size="15" font-weight="700" letter-spacing="4">FULL-STACK DEFI ENGINEER</text>
    <text x="34" y="207" fill="#f2f5f3" font-size="82" font-weight="800" letter-spacing="-4">NICOLÒ</text>
    <text x="34" y="285" fill="#f3d37c" font-size="82" font-weight="800" letter-spacing="-4">MANNI</text>
    <text x="40" y="329" fill="#b6c6c2" font-size="17" font-weight="500">CALM INTERFACES.</text>
    <text x="40" y="355" fill="#b6c6c2" font-size="17" font-weight="500">COMPLEX FINANCIAL SYSTEMS.</text>
  </g>

  <path d="M40 382H600" stroke="#31464b" />

  <g aria-label="Trust flow system diagram">
    <ellipse cx="320" cy="520" rx="260" ry="160" fill="url(#halo)" />
    <path class="signal-line" d="M178 466C240 426 400 426 462 466" fill="none" stroke="url(#signal)" stroke-width="2.5" stroke-dasharray="12 14" />
    <path class="signal-line slow" d="M500 488C520 550 455 602 385 606" fill="none" stroke="url(#signal)" stroke-width="2.5" stroke-dasharray="12 14" />
    <path class="signal-line" d="M255 606C180 594 131 545 140 488" fill="none" stroke="url(#signal)" stroke-width="2.5" stroke-dasharray="12 14" />

    <g class="motion-only">
      <circle class="packet" r="5" fill="#f3d37c">
        <animateMotion dur="4s" repeatCount="indefinite" path="M178 466C240 426 400 426 462 466" />
      </circle>
      <circle class="packet" r="5" fill="#80c9a5">
        <animateMotion dur="5.6s" begin="-2s" repeatCount="indefinite" path="M500 488C520 550 455 602 385 606" />
      </circle>
      <circle class="packet" r="5" fill="#f3d37c">
        <animateMotion dur="4.8s" begin="-3s" repeatCount="indefinite" path="M255 606C180 594 131 545 140 488" />
      </circle>
    </g>

    <g class="mono">
      <g>
        <rect x="76" y="443" width="142" height="62" rx="8" fill="#111f24" stroke="#496067" />
        <circle class="pulse" cx="98" cy="466" r="4" fill="#80c9a5" />
        <text x="114" y="470" fill="#f2f5f3" font-size="15" font-weight="700">INTERFACE</text>
        <text x="98" y="490" fill="#728783" font-size="10" letter-spacing="1.3">MAKE IT CLEAR</text>
      </g>
      <g>
        <rect x="422" y="443" width="142" height="62" rx="8" fill="#111f24" stroke="#496067" />
        <circle class="pulse delay" cx="444" cy="466" r="4" fill="#f3d37c" />
        <text x="460" y="470" fill="#f2f5f3" font-size="15" font-weight="700">API</text>
        <text x="444" y="490" fill="#728783" font-size="10" letter-spacing="1.3">MAKE IT SOLID</text>
      </g>
      <g>
        <rect x="249" y="582" width="142" height="62" rx="8" fill="#111f24" stroke="#496067" />
        <circle class="pulse" cx="271" cy="605" r="4" fill="#80c9a5" />
        <text x="287" y="609" fill="#f2f5f3" font-size="15" font-weight="700">CONTRACT</text>
        <text x="271" y="629" fill="#728783" font-size="10" letter-spacing="1.3">MAKE IT SAFE</text>
      </g>
      <text x="320" y="511" fill="#728783" font-size="11" letter-spacing="3" text-anchor="middle">TRUST FLOW</text>
      <text x="320" y="538" fill="#f3d37c" font-size="21" font-weight="700" letter-spacing="2" text-anchor="middle">LIVE</text>
    </g>
  </g>

  <g class="mono" font-size="11" letter-spacing="1.5">
    <text x="40" y="680" fill="#80c9a5">product / architecture / onchain credit</text>
    <rect class="blink" x="376" y="668" width="8" height="15" fill="#f3d37c" />
    <text x="600" y="680" fill="#50666a" text-anchor="end">911</text>
  </g>
</svg>
