<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440" role="img" aria-labelledby="title desc">
  <title id="title">Nicolò Manni — Full-stack DeFi engineer</title>
  <desc id="desc">An animated systems diagram connects interface, API, and smart contract layers beside Nicolò Manni's name.</desc>

  <defs>
    <linearGradient id="signal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f3d37c" />
      <stop offset="0.5" stop-color="#d9943f" />
      <stop offset="1" stop-color="#f3d37c" />
    </linearGradient>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#f3d37c" stop-opacity="0.18" />
      <stop offset="1" stop-color="#f3d37c" stop-opacity="0" />
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#d8e2dc" stroke-opacity="0.055" />
    </pattern>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .mono { font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace; }
    .signal-line { animation: flow 5s linear infinite; }
    .signal-line.slow { animation-duration: 7s; animation-direction: reverse; }
    .pulse { transform-box: fill-box; transform-origin: center; animation: pulse 2.8s ease-in-out infinite; }
    .pulse.delay { animation-delay: -1.4s; }
    .blink { animation: blink 1s steps(1, end) infinite; }
    .scan { animation: scan 9s ease-in-out infinite; }
    .packet { filter: url(#glow); }
    @keyframes flow { to { stroke-dashoffset: -104; } }
    @keyframes pulse { 0%, 100% { opacity: .45; transform: scale(.82); } 50% { opacity: 1; transform: scale(1.12); } }
    @keyframes blink { 0%, 48% { opacity: 1; } 49%, 100% { opacity: 0; } }
    @keyframes scan { 0%, 100% { transform: translateY(-150px); opacity: 0; } 15%, 85% { opacity: .45; } 50% { transform: translateY(360px); opacity: .2; } }
    @media (prefers-reduced-motion: reduce) {
      .signal-line, .pulse, .blink, .scan { animation: none !important; }
      .motion-only { display: none; }
    }
  </style>

  <rect width="1200" height="440" rx="26" fill="#0b1418" />
  <rect x="1" y="1" width="1198" height="438" rx="25" fill="none" stroke="#31464b" stroke-width="2" />
  <rect x="20" y="20" width="1160" height="400" rx="15" fill="url(#grid)" />
  <rect class="scan" x="20" y="20" width="1160" height="70" rx="15" fill="url(#halo)" opacity="0" />

  <g class="mono" font-size="12" letter-spacing="2.2">
    <circle class="pulse" cx="57" cy="49" r="5" fill="#80c9a5" />
    <text x="72" y="53" fill="#b6c6c2">SYSTEM PROFILE / 01</text>
    <text x="1144" y="53" fill="#728783" text-anchor="end">TREVISO · ITALY / UTC+2</text>
  </g>

  <g class="sans">
    <text x="54" y="113" fill="#f3d37c" font-size="14" font-weight="700" letter-spacing="4">FULL-STACK DEFI ENGINEER</text>
    <text x="49" y="203" fill="#f2f5f3" font-size="82" font-weight="800" letter-spacing="-4">NICOLÒ</text>
    <text x="49" y="281" fill="#f3d37c" font-size="82" font-weight="800" letter-spacing="-4">MANNI</text>
    <text x="55" y="326" fill="#b6c6c2" font-size="17" font-weight="500" letter-spacing="0.4">I BUILD CALM INTERFACES FOR COMPLEX FINANCIAL SYSTEMS.</text>
  </g>

  <path d="M55 351H617" stroke="#31464b" />
  <g class="mono" font-size="13" letter-spacing="1.5">
    <text x="55" y="383" fill="#80c9a5">product</text>
    <text x="121" y="383" fill="#50666a">/</text>
    <text x="142" y="383" fill="#80c9a5">architecture</text>
    <text x="251" y="383" fill="#50666a">/</text>
    <text x="272" y="383" fill="#80c9a5">onchain credit</text>
    <rect class="blink" x="407" y="371" width="8" height="15" fill="#f3d37c" />
  </g>

  <g aria-label="Trust flow system diagram">
    <circle cx="915" cy="223" r="180" fill="url(#halo)" />
    <path class="signal-line" d="M788 148C846 104 917 104 974 148" fill="none" stroke="url(#signal)" stroke-width="2" stroke-dasharray="12 14" stroke-dashoffset="0" />
    <path class="signal-line slow" d="M1000 174C1031 229 1009 285 943 314" fill="none" stroke="url(#signal)" stroke-width="2" stroke-dasharray="12 14" stroke-dashoffset="0" />
    <path class="signal-line" d="M886 314C817 293 777 246 779 174" fill="none" stroke="url(#signal)" stroke-width="2" stroke-dasharray="12 14" stroke-dashoffset="0" />

    <g class="motion-only">
      <circle class="packet" r="4" fill="#f3d37c">
        <animateMotion dur="4s" repeatCount="indefinite" path="M788 148C846 104 917 104 974 148" />
      </circle>
      <circle class="packet" r="4" fill="#80c9a5">
        <animateMotion dur="5.6s" begin="-2s" repeatCount="indefinite" path="M1000 174C1031 229 1009 285 943 314" />
      </circle>
      <circle class="packet" r="4" fill="#f3d37c">
        <animateMotion dur="4.8s" begin="-3s" repeatCount="indefinite" path="M886 314C817 293 777 246 779 174" />
      </circle>
    </g>

    <g class="mono">
      <g>
        <rect x="720" y="119" width="136" height="58" rx="8" fill="#111f24" stroke="#496067" />
        <circle class="pulse" cx="742" cy="140" r="4" fill="#80c9a5" />
        <text x="758" y="144" fill="#f2f5f3" font-size="15" font-weight="700">INTERFACE</text>
        <text x="742" y="162" fill="#728783" font-size="10" letter-spacing="1.5">MAKE IT CLEAR</text>
      </g>
      <g>
        <rect x="974" y="119" width="136" height="58" rx="8" fill="#111f24" stroke="#496067" />
        <circle class="pulse delay" cx="996" cy="140" r="4" fill="#f3d37c" />
        <text x="1012" y="144" fill="#f2f5f3" font-size="15" font-weight="700">API</text>
        <text x="996" y="162" fill="#728783" font-size="10" letter-spacing="1.5">MAKE IT SOLID</text>
      </g>
      <g>
        <rect x="855" y="294" width="136" height="58" rx="8" fill="#111f24" stroke="#496067" />
        <circle class="pulse" cx="877" cy="315" r="4" fill="#80c9a5" />
        <text x="893" y="319" fill="#f2f5f3" font-size="15" font-weight="700">CONTRACT</text>
        <text x="877" y="337" fill="#728783" font-size="10" letter-spacing="1.5">MAKE IT SAFE</text>
      </g>
      <text x="915" y="216" fill="#728783" font-size="11" letter-spacing="3" text-anchor="middle">TRUST FLOW</text>
      <text x="915" y="238" fill="#f3d37c" font-size="19" font-weight="700" letter-spacing="2" text-anchor="middle">LIVE</text>
    </g>
  </g>

  <g class="mono" font-size="10" letter-spacing="1.6" fill="#50666a">
    <text x="716" y="393">SIGNAL: STABLE</text>
    <text x="1110" y="393" text-anchor="end">911 / BUILD 20.26</text>
    <path d="M810 389h40l10-7 13 14 16-20 14 13h52" fill="none" stroke="#80c9a5" stroke-width="1.5" />
  </g>
</svg>
